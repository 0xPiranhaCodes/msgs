[package]
name = "msgs"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
description = "Serverless encrypted terminal chat that auto-joins coworkers on the same network"
license = "MIT"
readme = "README.md"
keywords = ["tui", "chat", "vpn", "peer-to-peer", "terminal"]
categories = ["command-line-utilities", "network-programming", "cryptography"]

[dependencies]
anyhow = "1"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
hkdf = "0.12"
instability = "=0.3.9"
postcard = { version = "1", features = ["alloc"] }
rand = "0.8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
snow = "0.10"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
unicode-width = "0.2"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
