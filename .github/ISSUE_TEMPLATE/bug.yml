name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include passphrases, private messages, identities, or VPN details. Report security issues privately under SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run …
        2. Press …
        3. Observe …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: msgs version or commit
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and architecture
      placeholder: macOS 27, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: terminal
    attributes:
      label: Terminal and VPN context
      description: Name the terminal and describe relevant VPN behavior without private addresses.
