name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What terminal-chat workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible result, not only an implementation.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy constraints
      options:
        - label: This proposal preserves no durable chat history and no server dependency.
          required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
